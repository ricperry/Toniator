[package]
name = "toniator-io"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
toniator-domain = { path = "../toniator-domain" }
serde.workspace = true
# Authored f64 colors and endpoint values must survive exact save/reopen round trips.
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_ignored = "0.1.14"
sha2.workspace = true
zip.workspace = true
libc.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }

[lib]
path = "src/lib.rs"
