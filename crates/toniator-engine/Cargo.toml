[package]
name = "toniator-engine"
version = "0.4.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rayon.workspace = true
toniator-domain = { path = "../toniator-domain" }
toniator-sampling = { path = "../toniator-sampling" }
toniator-patterns = { path = "../toniator-patterns" }
toniator-render = { path = "../toniator-render" }
toniator-io = { path = "../toniator-io" }
sha2.workspace = true
serde_json.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Enables the patterns-side test evidence record only while compiling this crate's tests.
toniator-patterns = { path = "../toniator-patterns", features = ["test-evidence"] }
image.workspace = true
zip.workspace = true

[features]
geometry-compute = ["toniator-patterns/geometry-compute"]
default = []
fast-preview = ["toniator-render/fast-preview"]
prepared-crop-pilot = ["toniator-render/prepared-crop-pilot"]

[[example]]
name = "prepared_crop_probe"
required-features = ["prepared-crop-pilot"]

[[example]]
name = "preview_cache_root_probe"
required-features = ["prepared-crop-pilot"]

[[example]]
name = "fast_preview_stage1_probe"
required-features = ["fast-preview"]

[[example]]
name = "fast_preview_stage2_cache_probe"
required-features = ["fast-preview"]
