[package]
name = "toniator-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
toniator-domain = { path = "../toniator-domain" }
toniator-sampling = { path = "../toniator-sampling" }
toniator-patterns = { path = "../toniator-patterns" }
toniator-render = { path = "../toniator-render" }
toniator-io = { path = "../toniator-io" }
sha2.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Enables the patterns-side test evidence record only while compiling this crate's tests.
toniator-patterns = { path = "../toniator-patterns", features = ["test-evidence"] }
image.workspace = true
