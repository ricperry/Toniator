[package]
name = "toniator-render"
version = "0.4.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vello_gpu = { workspace = true, optional = true }
vello_common = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
robust.workspace = true
image.workspace = true
png = "0.18.1"
rayon.workspace = true
i_overlay.workspace = true
kurbo.workspace = true
toniator-domain = { path = "../toniator-domain" }
toniator-geometry = { path = "../toniator-geometry" }

[lib]
path = "src/lib.rs"

[features]
default = []
fast-preview = ["dep:vello_gpu", "dep:vello_common", "dep:wgpu"]
prepared-crop-pilot = []
