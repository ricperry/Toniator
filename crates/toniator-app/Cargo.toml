[package]
name = "toniator-app"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_12"] }
glib = "0.22.0"
gio = "0.22.0"
toniator-domain = { path = "../toniator-domain" }
toniator-geometry = { path = "../toniator-geometry" }
toniator-engine = { path = "../toniator-engine" }
toniator-io = { path = "../toniator-io" }
toniator-patterns = { path = "../toniator-patterns" }
serde_json.workspace = true
async-channel = "2.5.0"

[build-dependencies]
glib-build-tools = "0.22.0"

[[bin]]
name = "toniator-app"
path = "src/main.rs"
