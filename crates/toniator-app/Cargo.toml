[package]
name = "toniator-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
glib = "0.22.0"
gio = "0.22.0"
toniator-domain = { path = "../toniator-domain" }
toniator-engine = { path = "../toniator-engine" }
toniator-io = { path = "../toniator-io" }

[build-dependencies]
glib-build-tools = "0.22.0"

[[bin]]
name = "toniator-app"
path = "src/main.rs"
