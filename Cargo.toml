[workspace]
members = [
    "crates/toniator-domain",
    "crates/toniator-geometry",
    "crates/toniator-sampling",
    "crates/toniator-patterns",
    "crates/toniator-render",
    "crates/toniator-io",
    "crates/toniator-engine",
    "crates/toniator-cli",
    "crates/toniator-app",
]
exclude = ["ToniatorLegacy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
sha2 = "0.10.9"
