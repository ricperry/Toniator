[workspace]
members = [
    "crates/toniator-domain",
    "crates/toniator-geometry",
    "crates/toniator-sampling",
    "crates/toniator-patterns",
    "crates/toniator-render",
    "crates/toniator-io",
    "crates/toniator-engine",
    "crates/toniator-cli",
    "crates/toniator-app",
]
exclude = ["ToniatorLegacy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The AVIF decoder deliberately uses the open-source system `dav1d` backend.
# Fedora builds therefore need the `libdav1d-devel` package available to pkg-config.
image = { version = "0.25.10", default-features = false, features = ["avif-native", "bmp", "exr", "jpeg", "png", "tiff", "webp"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
sha2 = "0.10.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
spade = { version = "=2.15.1", default-features = false, features = ["std"] }
rayon = "1.10"
